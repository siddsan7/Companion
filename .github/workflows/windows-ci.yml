name: Windows CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  installer:
    name: Windows installer lifecycle
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm.cmd ci
      - run: npm.cmd run prepare:electron
      - name: Prepare pinned WiX compiler
        shell: pwsh
        run: |
          New-Item -ItemType Directory dist
          Invoke-WebRequest 'https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip' -OutFile dist/wix.zip
          if ((Get-FileHash dist/wix.zip).Hash -ne '6AC824E1642D6F7277D0ED7EA09411A508F6116BA6FAE0AA5F2C7DAA2FF43D31') { throw 'WiX archive digest differs.' }
          Expand-Archive dist/wix.zip dist/wix
      - run: npm.cmd run package:windows
      - run: npm.cmd run package:windows -- 0.1.0
      - name: Install, launch, upgrade and uninstall
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm.cmd run test:installer
      - name: Retain verified installer for review
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Companion-windows-x64
          path: |
            dist/Companion-*-windows-x64.msi*
            !dist/Companion-0.1.0-windows-x64.msi*
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  checks:
    # The desktop suite outgrew one 45-minute job, so it runs in four shards.
    name: Windows checks (${{ matrix.shard }}/4)
    runs-on: windows-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install locked dependencies
        run: npm.cmd ci
      - name: Check source
        run: npm.cmd run check
      - name: Prepare pinned Electron runtime
        run: npm.cmd run prepare:electron
      # Tests use disposable roots and controlled provider/OS fixtures, not live readiness gates.
      - name: Test desktop workflows
        # The runner's default TEMP is an 8.3 short path (C:\Users\RUNNER~1\...). Its real
        # path differs, so the app's alias guards correctly refuse test roots made there.
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
        run: npm.cmd test -- --shard=${{ matrix.shard }}/4
