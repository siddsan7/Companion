<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Companion</title><link rel="stylesheet" href="style.css"></head>
<body><main><header><h1>Companion</h1><p>Capture now. Connect ideas later.</p></header>
<section aria-label="Vault setup"><button id="choose">Choose vault</button><span id="vault"></span><label>Parent folder<input id="parent" value="Companion"></label><button id="configure">Use this folder</button><p id="location"></p><small>Captures are your Markdown notes. Imported sources, annotations, ideas, briefs and revision snapshots use separate areas.</small></section>
<section><h2>Quick capture</h2><label>Thought or link<textarea id="text" rows="3" placeholder="What would you like to keep?"></textarea></label><button id="add-excerpt">Add source excerpt</button><label id="excerpt-label" hidden>User-supplied excerpt<textarea id="excerpt" rows="3"></textarea><small>Paste text yourself. Companion does not fetch or verify webpages.</small></label><button id="save">Save capture</button></section>
<p role="status" aria-live="polite"></p><p role="alert" id="warnings"></p><section><nav><button id="today">Today</button><button id="history">All captures</button><button id="refresh">Refresh</button></nav><p id="timezone"></p><label>Search captures<input id="search" type="search"></label><div id="captures"></div></section>
</main><script src="renderer.js"></script><script src="codex-view.js"></script></body></html>
